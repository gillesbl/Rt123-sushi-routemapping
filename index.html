<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sushi Bezorgroutes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #f5f5f5; color: #333; min-height: 100vh;
         display: flex; flex-direction: column; align-items: center;
         justify-content: center; padding: 24px; }
  h1 { font-size: 22px; margin-bottom: 24px; color: #d32f2f; }
  .links { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 400px; }
  a { display: block; padding: 18px 24px; background: #d32f2f; color: white;
      font-size: 17px; font-weight: 600; border-radius: 8px;
      text-decoration: none; text-align: center; }
  a:active { background: #b71c1c; }
</style>
</head>
<body>
<div id="loginScreen" style="display:flex;flex-direction:column;align-items:center;gap:12px;">
  <h1>Sushi Bezorgroutes</h1>
  <input type="password" id="pwInput" placeholder="Wachtwoord" style="font-size:16px;padding:12px 16px;border:1px solid #ccc;border-radius:6px;width:100%;max-width:300px;text-align:center;">
  <button onclick="checkPw()" style="padding:12px 24px;background:#d32f2f;color:white;font-size:16px;font-weight:600;border:none;border-radius:6px;cursor:pointer;-webkit-appearance:none;">Inloggen</button>
  <p id="pwError" style="color:#d32f2f;display:none;">Onjuist wachtwoord</p>
</div>
<div id="mainContent" style="display:none;">
<h1>Sushi Bezorgroutes</h1>
<div class="links">
  <a href="route_Car_1_-_Den_Haag.html">Car 1 - Den Haag</a>
  <a href="route_Car_2_-_Rotterdam_en_Utrecht.html">Car 2 - Rotterdam & Utrecht</a>
  <a href="route_Car_3_-_Amsterdam.html">Car 3 - Amsterdam</a>
</div>
</div>
<script>
function checkPw() {
  if (document.getElementById('pwInput').value === 'RT123sushi') {
    sessionStorage.setItem('sushi_auth', '1');
    showContent();
  } else {
    document.getElementById('pwError').style.display = 'block';
  }
}
function showContent() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainContent').style.display = '';
}
document.getElementById('pwInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkPw();
});
if (sessionStorage.getItem('sushi_auth') === '1') showContent();
</script>
</body>
</html>
